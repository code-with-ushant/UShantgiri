<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle Matrix/Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="440" y1="0" x2="440" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="680" y1="0" x2="680" y2="500"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>

  <!-- Central Code Terminal Window -->
  <g transform="translate(100, 70)">
    <!-- Terminal Box -->
    <rect width="600" height="360" rx="16" fill="rgba(11, 14, 22, 0.9)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.6))"/>
    
    <!-- Titlebar -->
    <rect width="600" height="42" rx="16" fill="rgba(255, 255, 255, 0.04)"/>
    <rect y="30" width="600" height="12" fill="rgba(255, 255, 255, 0.04)"/>
    <line x1="0" y1="42" x2="600" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Traffic Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ff5f56"/>
    <circle cx="42" cy="21" r="5.5" fill="#ffbd2e"/>
    <circle cx="60" cy="21" r="5.5" fill="#27c93f"/>

    <text x="300" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="rgba(255, 255, 255, 0.5)">library_bookkeeping.c — GCC</text>

    <!-- C Code Snippet -->
    <g font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" line-height="1.6">
      <text x="32" y="78" fill="#ff7b72">struct</text>
      <text x="88" y="78" fill="#d2a8ff">book</text>
      <text x="128" y="78" fill="#e6edf3">{</text>
      
      <text x="52" y="106" fill="#79c0ff">char</text>
      <text x="96" y="106" fill="#e6edf3">title[20];</text>

      <text x="52" y="132" fill="#79c0ff">char</text>
      <text x="96" y="132" fill="#e6edf3">author[20];</text>

      <text x="52" y="158" fill="#79c0ff">char</text>
      <text x="96" y="158" fill="#e6edf3">publisher[20];</text>

      <text x="52" y="184" fill="#79c0ff">float</text>
      <text x="104" y="184" fill="#e6edf3">price;</text>

      <text x="32" y="210" fill="#e6edf3">};</text>

      <!-- Search by Author Function -->
      <text x="32" y="244" fill="#79c0ff">void</text>
      <text x="74" y="244" fill="#d2a8ff">fbbyaouthor</text>
      <text x="170" y="244" fill="#e6edf3">(<text fill="#79c0ff">char</text> *au, <text fill="#ff7b72">struct</text> book b[], <text fill="#79c0ff">int</text> size) {</text>

      <text x="52" y="272" fill="#ff7b72">for</text>
      <text x="84" y="272" fill="#e6edf3">(<text fill="#79c0ff">int</text> i = 0; i &lt; size; i++) {</text>

      <text x="74" y="298" fill="#ff7b72">if</text>
      <text x="96" y="298" fill="#e6edf3">(strcmp(b[i].author, au) == 0)</text>
      <text x="340" y="298" fill="#7ee787">/* Indexed Match */</text>

      <text x="52" y="324" fill="#e6edf3">}</text>
      <text x="32" y="344" fill="#e6edf3">}</text>
    </g>

    <!-- Side Badge / Floating Icon -->
    <g transform="translate(430, 80)">
      <rect width="140" height="90" rx="12" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1"/>
      <!-- Book Icon -->
      <path d="M40 28v36c8-5 16-5 24 0 8-5 16-5 24 0V28c-8-5-16-5-24 0-8-5-16-5-24 0z" fill="none" stroke="url(#cyanAccent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M64 28v36" stroke="url(#cyanAccent)" stroke-width="2" stroke-linecap="round"/>
      <text x="70" y="78" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#4facfe" letter-spacing="0.5">STRUCT INVENTORY</text>
    </g>
  </g>

  <!-- Live Bottom Indicator -->
  <g transform="translate(240, 450)">
    <rect width="320" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="16" cy="14" r="4" fill="#00f2fe"/>
    <text x="28" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#e6edf3">Dynamic Memory • Fast Author Search Filter</text>
  </g>
</svg>
