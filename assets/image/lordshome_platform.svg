<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="lhnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c"/>
      <stop offset="50%" stop-color="#211712"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="lhnGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ff375f"/>
    </linearGradient>
    <radialGradient id="centerWarmGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#lhnBg)"/>

  <!-- Subtle Studio Grid -->
  <g stroke="rgba(255,159,10,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Radial Halo -->
  <circle cx="400" cy="170" r="180" fill="url(#centerWarmGlow)"/>

  <!-- Shelter & Shield Monogram -->
  <g transform="translate(400, 160)">
    <!-- Shield / Home Outline -->
    <path d="M 0 -70 L 65 -25 L 65 35 C 65 65 0 85 0 85 C 0 85 -65 65 -65 35 L -65 -25 Z" fill="#241610" stroke="url(#lhnGlow)" stroke-width="2.5"/>
    
    <!-- Home Roof & Hearth Lines -->
    <path d="M -30 0 L 0 -26 L 30 0 L 30 32 L -30 32 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -10 32 L -10 16 L 10 16 L 10 32" fill="none" stroke="#ff9f0a" stroke-width="2.5"/>
    <circle cx="0" cy="-6" r="4" fill="#ff375f"/>
  </g>

  <!-- Title -->
  <text x="400" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="3">LORD'S HOME NEPAL</text>
  <text x="400" y="306" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500" fill="rgba(255,255,255,0.7)" letter-spacing="1.2">CHILDREN WELFARE PLATFORM &amp; PORTAL</text>

  <!-- Spec Pill Badge -->
  <g transform="translate(400, 362)">
    <rect x="-190" y="-17" width="380" height="34" rx="17" fill="rgba(255,159,10,0.12)" stroke="rgba(255,159,10,0.35)" stroke-width="1"/>
    <circle cx="-166" cy="0" r="4.5" fill="#ff9f0a"/>
    <text x="-154" y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#ff9f0a">NODE.JS CORE</text>
    <text x="-66" y="5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.7)">• BILINGUAL &amp; PRIVACY SAFEGUARDS</text>
  </g>
</svg>